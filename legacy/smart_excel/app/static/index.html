<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实时日志</title>
    <style>
        /* --- 主要修改在这里 --- */
        body {
            /* 将背景色从深色改为清爽的浅灰色 */
            background-color: #f0f2f5;
            /* 默认文字颜色改为深色以保证可读性 */
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            /* 标题颜色也调整为适合浅色背景的深色 */
            color: #2c3e50;
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* --- 日志容器样式保持不变，维持科技感 --- */
        #logContainer {
            background-color: #000000;
            color: #cccccc;
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
            font-family: 'Menlo', 'Monaco', 'Consolas', "Courier New", monospace;
            font-size: 14px;
            height: 60vh;
            overflow-y: scroll;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 美化滚动条 */
        #logContainer::-webkit-scrollbar {
            width: 10px;
        }
        #logContainer::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        #logContainer::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 5px;
            border: 2px solid #1a1a1a;
        }

        .log-entry {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        /* 日志级别颜色 */
        .log-INFO { color: #cccccc; }
        .log-ERROR { color: #ff4d4d; }
        .log-WARNING { color: #ffff00; }
        .log-DEBUG { color: #888888; }

        /* 连接状态消息样式 */
        .status-connected { color: #2ecc71; font-weight: bold; }
        .status-disconnected { color: #ff4d4d; font-weight: bold; }

        /* 闪烁光标 */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: #00ff00; }
        }
    </style>
</head>
<body>
    <h1>实时运行日志</h1>
    <div id="logContainer"></div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const socket = new WebSocket('ws://localhost:8765');

        // 创建并添加闪烁光标
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        logContainer.appendChild(cursor);

        // 封装一个函数用于在光标前插入日志
        function appendLog(element) {
            logContainer.insertBefore(element, cursor);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        socket.onopen = function(event) {
            console.log('WebSocket 连接已建立');
            const entry = document.createElement('div');
            entry.textContent = '连接到日志服务器成功！';
            entry.className = 'status-connected';
            appendLog(entry);
        };

        socket.onmessage = function(event) {
            const message = event.data;
            console.log('收到日志: ', message);

            const entry = document.createElement('div');
            entry.textContent = message;
            entry.className = 'log-entry';

            // 根据日志级别添加不同的样式
            if (message.includes("ERROR")) {
                entry.classList.add('log-ERROR');
            } else if (message.includes("WARNING")) {
                entry.classList.add('log-WARNING');
            } else if (message.includes("INFO")) {
                entry.classList.add('log-INFO');
            } else if (message.includes("DEBUG")) {
                entry.classList.add('log-DEBUG');
            }

            appendLog(entry);
        };

        socket.onclose = function(event) {
            console.log('WebSocket 连接已关闭:', event);
            const entry = document.createElement('div');
            entry.textContent = '与日志服务器的连接已断开。';
            entry.className = 'status-disconnected';
            appendLog(entry);
        };

        socket.onerror = function(error) {
            console.error('WebSocket 错误:', error);
            const entry = document.createElement('div');
            entry.textContent = 'WebSocket 连接发生错误。';
            entry.className = 'status-disconnected';
            appendLog(entry);
        };
    </script>
</body>
</html>
