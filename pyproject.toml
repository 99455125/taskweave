[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskweave"
version = "0.1.0"
description = "Local task and step automation with extensible plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
taskweave = "taskweave.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taskweave*"]
