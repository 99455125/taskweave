[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskweave"
version = "0.1.0"
description = "Local task and step automation with extensible plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5", "packaging>=24,<27", "certifi>=2024.8.30"]

[project.scripts]
taskweave = "taskweave.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taskweave*"]

[tool.setuptools.package-data]
"taskweave.infrastructure" = ["sql/*.sql"]
"taskweave.integration" = ["skill_assets/*.md", "skill_assets/references/*.md"]

[project.optional-dependencies]
browser = ["taskweave-playwright"]
ocr = ["taskweave-ocr"]
database = ["taskweave-tidb"]
utility = ["taskweave-utility"]
files = ["taskweave-file"]
pdf = ["taskweave-pdf"]
dataset = ["taskweave-dataset"]
excel = ["taskweave-excel"]
process = ["taskweave-process"]
ssh = ["taskweave-ssh"]
baota_dashboard = ["taskweave-baota-dashboard"]
nacos = ["taskweave-nacos"]
wordpress = ["taskweave-wordpress"]
uniapp = ["taskweave-uniapp"]
wechat_dev = ["taskweave-wechat-dev"]
gui = ["nicegui>=3,<4", "pywebview>=6,<7"]
mcp = [
    "mcp>=2.3,<3",
]

[dependency-groups]
test-pdf = ["pypdf>=6,<7"]
build = ["pyinstaller>=6.11,<7"]

[tool.uv.sources]
taskweave-playwright = { path = "plugins/playwright", editable = true }
taskweave-ocr = { path = "plugins/ocr", editable = true }

taskweave-tidb = { path = "plugins/tidb", editable = true }
taskweave-utility = { path = "plugins/utility", editable = true }
taskweave-file = { path = "plugins/file", editable = true }
taskweave-pdf = { path = "plugins/pdf", editable = true }
taskweave-dataset = { path = "plugins/dataset", editable = true }
taskweave-excel = { path = "plugins/excel", editable = true }
taskweave-process = { path = "plugins/process", editable = true }
taskweave-ssh = { path = "plugins/ssh", editable = true }
taskweave-baota-dashboard = { path = "plugins/baota_dashboard", editable = true }
taskweave-nacos = { path = "plugins/nacos", editable = true }
taskweave-wordpress = { path = "plugins/wordpress", editable = true }
taskweave-uniapp = { path = "plugins/uniapp", editable = true }
taskweave-wechat-dev = { path = "plugins/wechat_dev", editable = true }
