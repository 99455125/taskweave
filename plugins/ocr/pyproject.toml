[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "taskweave-ocr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["ddddocr==1.6.1", "onnxruntime==1.20.1; python_version < '3.14'", "onnxruntime==1.30.0; python_version >= '3.14'", "opencv-python==4.11.0.86; sys_platform == 'darwin' or sys_platform == 'win32'", "opencv-python-headless==4.11.0.86; sys_platform == 'linux'"]
[project.entry-points."taskweave.plugins"]
ocr = "taskweave_ocr:OcrPlugin"
[tool.setuptools.packages.find]
where = ["src"]
