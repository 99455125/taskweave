[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskweave-dataset"
version = "0.1.0"
description = "TaskWeave internal datasets and SQL transformations"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."taskweave.plugins"]
dataset = "taskweave_dataset:DatasetPlugin"

[tool.setuptools.packages.find]
where = ["src"]
