[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "taskweave-baota-dashboard"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<0.29", "cryptography>=44,<51"]
[project.entry-points."taskweave.plugins"]
baota_dashboard = "taskweave_baota_dashboard:BaotaDashboardPlugin"
[tool.setuptools.packages.find]
where = ["src"]
