[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "taskweave-wordpress"
version = "0.1.0"
description = "Bounded local and SSH WordPress operations"
requires-python = ">=3.10"
dependencies = ["taskweave>=0.1,<1", "taskweave-process>=0.1,<1", "taskweave-ssh>=0.1,<1"]
[project.entry-points."taskweave.plugins"]
wordpress = "taskweave_wordpress:WordPressPlugin"
[tool.setuptools.packages.find]
where = ["src"]
