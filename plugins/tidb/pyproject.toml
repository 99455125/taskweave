[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "taskweave-tidb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyMySQL>=1.1,<2", "sqlglot>=26,<31", "certifi>=2024.8.30"]
[project.entry-points."taskweave.plugins"]
tidb = "taskweave_tidb:TiDBPlugin"
[tool.setuptools.packages.find]
where = ["src"]
