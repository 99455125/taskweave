[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "taskweave-ssh"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["asyncssh[bcrypt]==2.24.0", "taskweave-process==0.1.0"]
[project.entry-points."taskweave.plugins"]
ssh = "taskweave_ssh:SshPlugin"
[tool.setuptools.packages.find]
where = ["src"]
